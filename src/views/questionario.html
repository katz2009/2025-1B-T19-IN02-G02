<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Temperatura - Pele ao Redor da Ferida</title>
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>

  <button class="back-button">&lt;</button>

  <div class="container">
    <div class="progress">
      <div class="circle">1</div>
      <div class="line"></div>
      <div class="circle">2</div>
      <div class="line"></div>
      <div class="circle">3</div>
      <div class="line"></div>
      <div class="circle">4</div>
      <div class="line"></div>
      <div class="circle">5</div>
      <div class="line"></div>
      <div class="circle">6</div>
      <div class="line"></div>
      <div class="circle">7</div>
      <div class="line"></div>
      <div class="circle">8</div>
      <div class="line"></div>
      <div class="circle">9</div>
    </div>

    <h2 class="question">TEMPERATURA EM GRAUS</h2>

    <div class="input-group">
      <label for="temperatura">Temperatura (°C):</label><br />
      <input 
        id="temperatura" 
        name="temperatura" 
        type="number" 
        step="0.01" 
        min="0" 
        max="99.99" 
        placeholder="00.00"
        pattern="^\d{1,2}(\.\d{1,2})?$"
        title="Insira um valor até 99.99 com até duas casas decimais"
      />
    </div>

    <button class="finalizar-button" type="button">Finalizar</button>
  </div>

</body>
</html>
